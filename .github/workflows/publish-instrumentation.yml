name: Publish Instrumentation (npm)

on:
  push:
    tags: ['v*']
  # Manual escape hatch: run against an existing tag (e.g. one release-please
  # created that didn't auto-trigger this workflow — see release-please.yml).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run build
        working-directory: integrations/nitro
      - run: npm publish --access public --provenance
        working-directory: integrations/nitro
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
