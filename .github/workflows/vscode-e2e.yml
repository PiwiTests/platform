name: VS Code E2E

# Drives the built VS Code extension in a real VS Code (downloaded by
# @vscode/test-electron) under Xvfb, on a fixture repository against a stub
# instance. Heavier than the unit checks in ci.yml's checks job, so it runs
# only on editor changes and on demand, like extension-e2e.yml.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/vscode/**'
      - 'packages/editor/**'
      - 'packages/core/**'
      - '.github/workflows/vscode-e2e.yml'

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ./package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Run the integration suite
        working-directory: ./apps/vscode
        run: xvfb-run -a npm run vscode:test:integration
