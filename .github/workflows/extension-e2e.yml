name: Extension E2E

# Drives the real built extension (dist/) with Chromium via --load-extension.
# Heavier than the unit/lint checks folded into ci.yml's checks job (needs a
# build + a real browser), so it runs only on extension changes and on demand,
# matching desktop-e2e.yml's pattern for the same reason.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/extension/**'
      - 'packages/core/**'
      - 'packages/picker-dom/**'
      - '.github/workflows/extension-e2e.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    # The release PR moves version numbers only; ci.yml checks it.
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    # The suite runs on one worker (see tests/e2e/playwright.config.ts) and
    # takes about 20 minutes; 30 leaves room for a slow runner.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ./package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      # The full Chromium, the build that loads extensions, installed on every
      # run: this workflow runs on pull requests only, and a cache a pull request
      # saves serves that pull request alone.
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run extension E2E
        working-directory: ./apps/extension
        run: npm run extension:test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: extension-e2e-report
          path: apps/extension/playwright-report
          if-no-files-found: ignore
