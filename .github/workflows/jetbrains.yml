name: JetBrains Plugin

# Builds and tests apps/jetbrains on WebStorm 2023.3, the oldest supported
# platform, and runs the Plugin Verifier on the IDEs gradle.properties lists.
# Only on editor changes and on demand: the IDE downloads are large.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/jetbrains/**'
      - 'packages/editor/**'
      - 'packages/core/**'
      - '.github/workflows/jetbrains.yml'

jobs:
  plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ./package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Build the editor service
        working-directory: ./packages/editor
        run: npm run editor:build

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Test and build
        working-directory: ./apps/jetbrains
        run: ./gradlew test buildPlugin

      - name: Upload the plugin
        uses: actions/upload-artifact@v7
        with:
          name: piwi-jetbrains
          path: apps/jetbrains/build/distributions/*.zip

  # One IDE per job: a runner's disk holds one unpacked IDE at a time.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        ide: ['WS:2023.3', 'WS:2026.2.3', 'IU:2026.2.3', 'RD:2026.2.2']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ./package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Build the editor service
        working-directory: ./packages/editor
        run: npm run editor:build

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Verify on ${{ matrix.ide }}
        working-directory: ./apps/jetbrains
        run: ./gradlew verifyPlugin -PverifyIdes=${{ matrix.ide }}
