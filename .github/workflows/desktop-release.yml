name: Desktop Release

# Builds the Tauri desktop app (Windows .msi + macOS .dmg + Linux .deb/.rpm/.AppImage)
# and attaches the installers to the GitHub Release release-please created for the
# tag, so they publish alongside the Docker image and npm packages (see publish.yml).
on:
  push:
    tags:
      - 'v*'
  # Manual escape hatch / dry-run: build the installers without releasing.
  workflow_dispatch:

env:
  # Match the runtime the app is built and tested against (apps/application/engines).
  PIWI_NODE_VERSION: 24.4.1

jobs:
  # Build the Nitro server bundle once on Linux (the proven path — the Windows
  # Nuxt build carries a legacyExternals workaround and isn't exercised in CI).
  # The .output is pure JS, so it's OS-agnostic; the per-OS native modules are
  # added in the desktop job via stage-server.mjs.
  build-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci
      - name: Build server bundle (node-server preset)
        run: npm run app:build --workspace=apps/application
        env:
          NITRO_PRESET: node-server
          PIWI_BUILD_SHA: ${{ github.sha }}
      - uses: actions/upload-artifact@v7
        with:
          name: app-output
          path: apps/application/.output
          # .output is dot-prefixed; upload-artifact@v4 skips hidden paths by default.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  desktop:
    needs: [build-server]
    permissions:
      contents: write # upload installers to the release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi
          - runner: macos-14
            target: aarch64-apple-darwin
            bundles: dmg
          # Ubuntu 22.04 (not latest): AppImage bundles the host's glibc, so
          # building on the oldest supported runner keeps the installer usable on
          # older distros. 22.04 is also the last runner carrying webkit2gtk-4.1.
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Tauri's Linux prerequisites: WebKitGTK for the webview, appindicator for
      # the tray icon, librsvg for the icons, patchelf for the AppImage. The last
      # two the AppImage bundler shells out to: xdg-utils (xdg-open) which it
      # copies in for the opener, and squashfs-tools (mksquashfs) to pack the image.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            xdg-utils \
            squashfs-tools

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install desktop tooling
        working-directory: apps/desktop
        run: npm install

      - name: Download server bundle
        uses: actions/download-artifact@v8
        with:
          name: app-output
          path: apps/application/.output

      - name: Fetch Node sidecar
        working-directory: apps/desktop
        run: node scripts/fetch-node.mjs --target ${{ matrix.target }} --node ${{ env.PIWI_NODE_VERSION }}

      # Shrink the bundled Node runtime with UPX (roughly halves it). Windows
      # only: UPX self-decompresses at launch, which conflicts with macOS
      # hardened runtime / notarization and is unreliable on arm64 Mach-O. Best
      # effort — if UPX fails we still ship the uncompressed runtime.
      - name: Compress Node sidecar (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        working-directory: apps/desktop
        shell: pwsh
        run: |
          choco install upx -y --no-progress
          upx --best --lzma "src-tauri/binaries/node-${{ matrix.target }}.exe"

      - name: Stage server (native modules for this OS)
        working-directory: apps/desktop
        run: node scripts/stage-server.mjs

      - name: Generate app icons
        working-directory: apps/desktop
        run: npx tauri icon ../application/public/logo.svg

      - name: Build & release desktop app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Linux AppImage bundling runs linuxdeploy (and its plugins), each a
          # self-mounting AppImage. GitHub runners have no libfuse2, so mounting
          # fails with "failed to run linuxdeploy"; extract-and-run unpacks the
          # tools to a temp dir instead. No-op on Windows/macOS.
          APPIMAGE_EXTRACT_AND_RUN: 1
          # macOS signing is intentionally OFF: passing an invalid/placeholder
          # APPLE_CERTIFICATE secret makes tauri-action fail at `security import`.
          # Builds ship unsigned (right-click -> Open). To enable signing, add
          # valid Apple Developer ID + notarization secrets and re-introduce the
          # APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / APPLE_SIGNING_IDENTITY /
          # APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID env here.
          #
          # In-app updates are opt-in and OFF until the updater keypair exists.
          # To enable them: run `npx tauri signer generate` locally, put the
          # public key into src-tauri/tauri.updater.conf.json, and add the
          # private key (+ its password) as the two secrets below. The config
          # overlay is applied only when the secret is present, so releases
          # without it build exactly as before — installers with no update
          # artifacts, and apps that report updates as unsupported.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && '--config src-tauri/tauri.updater.conf.json' || '' }}
          # Attach to the release release-please already made for this tag. On a
          # manual dispatch (no tag) tagName is empty, so tauri-action just builds.
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}

      # Dry-run only: make the built installers downloadable as a workflow artifact
      # (they are not attached to any release unless this was a tag build).
      - name: Upload installers (dry-run)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v7
        with:
          name: piwi-desktop-${{ matrix.target }}
          path: |
            apps/desktop/src-tauri/target/**/release/bundle/**/*.msi
            apps/desktop/src-tauri/target/**/release/bundle/**/*.dmg
            apps/desktop/src-tauri/target/**/release/bundle/**/*.deb
            apps/desktop/src-tauri/target/**/release/bundle/**/*.rpm
            apps/desktop/src-tauri/target/**/release/bundle/**/*.AppImage
          if-no-files-found: warn
          retention-days: 7
