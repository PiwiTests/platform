name: Publish NuGet Package

on:
  push:
    tags: ['v*']
  # Manual escape hatch: run against an existing tag (e.g. one release-please
  # created that didn't auto-trigger this workflow — see release-please.yml).
  workflow_dispatch:

jobs:
  publish-nuget:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'
      # Packs every packable project in the solution (the test project is not)
      # at the one version release-please stamps on all of them. Re-running
      # against a tag skips the packages already on nuget.org.
      - name: Pack & push
        run: |
          dotnet pack integrations/aspnetcore/PiwiTests.Instrumentation.slnx \
            -c Release \
            -o ./nupkg
          dotnet nuget push ./nupkg/*.nupkg \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
