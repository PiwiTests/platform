name: Desktop E2E

# Runs the Rust crate's unit tests, then smoke-tests the real desktop shell by
# driving its webview with Playwright via tauri-plugin-playwright (the app is
# built with the `e2e-testing` feature, which embeds the control plugin). The
# smoke test boots the whole app — server sidecar + native window — so this is
# heavier and slower than the unit/integration CI; it runs only on desktop
# changes and on demand.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/desktop-e2e.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Match the runtime the app bundles (apps/application/engines / desktop-release.yml).
  PIWI_NODE_VERSION: 24.4.1

jobs:
  e2e:
    # macOS runs the real Tauri webview headed (no xvfb), matching the plugin's
    # own e2e setup. The release PR moves version numbers only; ci.yml checks it.
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.PIWI_NODE_VERSION }}
          cache: npm

      - name: Install workspace deps
        run: npm ci

      - name: Build the server bundle
        # The Nuxt/Vite SSR build needs more heap than Node's default cap on the
        # macOS runner (it OOMs at ~2 GB otherwise; the ubuntu builds get a higher
        # default and don't need this).
        run: npm run app:build --workspace=apps/application
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Install desktop deps
        working-directory: apps/desktop
        run: npm ci

      - name: Stage the Node sidecar + bundled server
        working-directory: apps/desktop
        run: |
          node scripts/fetch-node.mjs --node "$PIWI_NODE_VERSION"
          npm run stage

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Generate app icons
        working-directory: apps/desktop
        run: npx tauri icon ../application/public/logo.svg

      - name: Install Playwright runtime
        working-directory: apps/desktop
        run: npx playwright install chromium

      # The shell's own unit tests (MCP client entries, the stdio bridge, the
      # local-run helpers). Runs ahead of the app build so a logic regression
      # fails here instead of minutes later in the webview. `build.rs` needs the
      # icons, the Node sidecar and the staged server, all present by this step.
      - name: Run Rust unit tests
        working-directory: apps/desktop/src-tauri
        run: cargo test

      # Compile up front so `tauri dev` (launched by the fixture) only has to boot,
      # keeping startup inside the fixture's startTimeout.
      - name: Pre-build the shell (e2e feature)
        working-directory: apps/desktop/src-tauri
        run: cargo build --features e2e-testing

      - name: Run e2e
        working-directory: apps/desktop
        run: npx playwright test --config e2e/playwright.config.ts

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: desktop-e2e-report
          path: apps/desktop/playwright-report
          if-no-files-found: ignore
