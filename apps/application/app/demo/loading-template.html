<div class="demo-loader">
  <style>
    .demo-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 16px;
      text-align: center;
      font-family:
        system-ui,
        -apple-system,
        'Segoe UI',
        sans-serif;
      background: #f4f4f5;
      color: #71717a;
    }
    .dark .demo-loader {
      background: #09090b;
      color: #a1a1aa;
    }
    .demo-loader h1 {
      margin: 16px 0 4px;
      font-size: 16px;
      font-weight: 600;
      color: #18181b;
    }
    .dark .demo-loader h1 {
      color: #fafafa;
    }
    .demo-loader p {
      max-width: 24rem;
      margin: 0;
      font-size: 14px;
      line-height: 1.5;
    }
    .demo-loader-status {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      margin-top: 24px;
      font-size: 12px;
    }
    .demo-loader-spinner {
      width: 20px;
      height: 20px;
      margin-bottom: 4px;
      border: 2px solid currentColor;
      border-right-color: transparent;
      border-radius: 50%;
      animation: demo-loader-spin 0.8s linear infinite;
    }
    .demo-loader-hint {
      visibility: hidden;
      animation: demo-loader-reveal 0s 2s forwards;
    }
    @keyframes demo-loader-spin {
      to {
        transform: rotate(360deg);
      }
    }
    @keyframes demo-loader-reveal {
      to {
        visibility: visible;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .demo-loader-spinner {
        animation: none;
      }
    }
  </style>
  <img src="/demo/logo.svg" width="48" height="48" alt="" />
  <h1>Piwi Dashboard — live demo</h1>
  <p>Your Playwright results, kept and explained. This demo runs entirely in your browser, on sample data.</p>
  <div class="demo-loader-status" role="status" data-nosnippet>
    <span class="demo-loader-spinner"></span>
    <span>Preparing demo…</span>
    <span class="demo-loader-hint">Setting up service worker for first use — this only happens once.</span>
  </div>
</div>
