<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
  .bg{fill:#fcfcfd;stroke:#e4e7ec}
  .t{fill:#101828;font-weight:700;font-size:16px}
  .s{fill:#475467;font-size:12.5px}
  .h{fill:#667085;font-size:10.5px;font-weight:600;letter-spacing:.06em}
  .l{fill:#344054;font-size:12px}
  .lb{fill:#344054;font-size:12.5px;font-weight:600}
  .m{fill:#667085;font-size:11px}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10.5px}
  .bst,.fct,.frt,.okt{font-size:11px}
  .box{fill:#ffffff;stroke:#d0d5dd}
  .hd{fill:#f2f4f7}
  .dash{fill:none;stroke:#98a2b3;stroke-dasharray:4 3}
  .edge{fill:none;stroke:#98a2b3;stroke-width:1.3}
  .acc{fill:none;stroke:#4353ff;stroke-width:1.6}
  .acct{fill:#4353ff;font-size:11px}
  .arr{fill:#98a2b3} .arra{fill:#4353ff}
  .bs{fill:#fffaeb;stroke:#f79009} .bst{fill:#b54708}
  .fc{fill:#fef3f2;stroke:#f04438} .fct{fill:#b42318}
  .fr{fill:#fff6ed;stroke:#fb6514} .frt{fill:#c4320a}
  .ok{fill:#ecfdf3;stroke:#12b76a} .okt{fill:#067647}
  .chip{stroke-width:1}
  @media (prefers-color-scheme: dark){
    .bg{fill:#161b26;stroke:#333741}
    .t{fill:#f5f5f6} .s{fill:#94969c} .h{fill:#85888e}
    .l,.lb{fill:#cecfd2} .m{fill:#85888e}
    .box{fill:#1f242f;stroke:#333741} .hd{fill:#262b36}
    .dash{stroke:#61646c} .edge{stroke:#61646c} .arr{fill:#61646c}
    .acc{stroke:#8098f9} .acct{fill:#8098f9} .arra{fill:#8098f9}
    .bs{fill:#2b1d07;stroke:#dc6803} .bst{fill:#fec84b}
    .fc{fill:#2d1210;stroke:#d92d20} .fct{fill:#fda29b}
    .fr{fill:#2b170c;stroke:#e04f16} .frt{fill:#f7b27a}
    .ok{fill:#0b2418;stroke:#079455} .okt{fill:#75e0a7}
  }
</style>
  <defs>
    <marker id="sglA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arr" d="M 0 1 L 9 5 L 0 9 z"/></marker>
    <marker id="sglB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arra" d="M 0 1 L 9 5 L 0 9 z"/></marker>
  </defs>
  <rect class="bg" x="0.5" y="0.5" width="919" height="359" rx="12"/>
  <text class="t" x="24" y="36">From runs to proposed tests</text>
  <text class="s" x="24" y="56">The Test Map is rebuilt from what runs already record; detectors read it, gaps are ranked, and every verdict tunes the detectors.</text>
  <rect class="box chip" x="24" y="84" width="160" height="186" rx="8"/>
  <path class="hd" d="M 24.5 114 L 24.5 92 Q 24.5 84.5 32 84.5 L 176 84.5 Q 183.5 84.5 183.5 92 L 183.5 114 Z"/>
  <text class="lb" x="38" y="104">1 · Sources</text>
  <text class="l" x="38" y="136">each run: requests and</text>
  <text class="l" x="38" y="153">the page it ends on</text>
  <text class="l" x="38" y="170">opt-in: page inventory,</text>
  <text class="l" x="38" y="187">server spans</text>
  <text class="l" x="38" y="204">declared: OpenAPI,</text>
  <text class="l" x="38" y="221">piwi.manifest.json</text>
  <text class="m" x="38" y="258">probe runs, PR diffs</text>
  <rect class="box chip" x="202" y="84" width="160" height="186" rx="8"/>
  <path class="hd" d="M 202.5 114 L 202.5 92 Q 202.5 84.5 210 84.5 L 354 84.5 Q 361.5 84.5 361.5 92 L 361.5 114 Z"/>
  <text class="lb" x="216" y="104">2 · Test Map</text>
  <text class="l" x="216" y="136">nodes: pages, controls,</text>
  <text class="l" x="216" y="153">routes, handlers,</text>
  <text class="l" x="216" y="170">dependencies, features</text>
  <text class="l" x="216" y="187">edges: reaches, checks,</text>
  <text class="l" x="216" y="204">loads, links, contains,</text>
  <text class="l" x="216" y="221">handled-by, calls</text>
  <text class="m" x="216" y="258">one graph per project</text>
  <rect class="box chip" x="380" y="84" width="160" height="186" rx="8"/>
  <path class="hd" d="M 380.5 114 L 380.5 92 Q 380.5 84.5 388 84.5 L 532 84.5 Q 539.5 84.5 539.5 92 L 539.5 114 Z"/>
  <text class="lb" x="394" y="104">3 · Detectors</text>
  <text class="l" x="394" y="136">one rule per kind of</text>
  <text class="l" x="394" y="153">gap, read from the</text>
  <text class="l" x="394" y="170">graph and the last</text>
  <text class="l" x="394" y="187">30 runs</text>
  <text class="m" x="394" y="258">after every run, nightly</text>
  <rect class="box chip" x="558" y="84" width="160" height="186" rx="8"/>
  <path class="hd" d="M 558.5 114 L 558.5 92 Q 558.5 84.5 566 84.5 L 710 84.5 Q 717.5 84.5 717.5 92 L 717.5 114 Z"/>
  <text class="lb" x="572" y="104">4 · Ranking</text>
  <text class="l" x="572" y="136">confidence × exposure:</text>
  <text class="l" x="572" y="153">churn, age, escape</text>
  <text class="l" x="572" y="170">history, priority</text>
  <text class="m" x="572" y="258">counts, not percentages</text>
  <rect class="box chip" x="736" y="84" width="160" height="186" rx="8"/>
  <path class="hd" d="M 736.5 114 L 736.5 92 Q 736.5 84.5 744 84.5 L 888 84.5 Q 895.5 84.5 895.5 92 L 895.5 114 Z"/>
  <text class="lb" x="750" y="104">5 · Where it shows</text>
  <text class="l" x="750" y="136">the Gaps tab</text>
  <text class="l" x="750" y="153">the PR comment</text>
  <text class="l" x="750" y="170">MCP tools for agents</text>
  <text class="l" x="750" y="187">the Gaps digest</text>
  <text class="m" x="750" y="258">a draft test per gap</text>
  <path class="acc" d="M 185 177.0 L 200 177.0" marker-end="url(#sglB)"/>
  <path class="acc" d="M 363 177.0 L 378 177.0" marker-end="url(#sglB)"/>
  <path class="acc" d="M 541 177.0 L 556 177.0" marker-end="url(#sglB)"/>
  <path class="acc" d="M 719 177.0 L 734 177.0" marker-end="url(#sglB)"/>
  <path class="edge" d="M 816.0 270 L 816.0 314 L 460.0 314 L 460.0 272" marker-end="url(#sglA)"/>
  <path class="edge" stroke-dasharray="4 3" d="M 440.0 314 L 282.0 314 L 282.0 272" marker-end="url(#sglA)"/>
  <text class="m" x="638.0" y="308" text-anchor="middle">triage: accept, snooze, dismiss, covered by</text>
  <text class="m" x="638.0" y="334" text-anchor="middle">each verdict counts for or against its detector; below 60% over 20 verdicts, it mutes itself</text>
  <text class="m" x="361.0" y="308" text-anchor="middle">covered by: a manual reaches edge</text>

</svg>
