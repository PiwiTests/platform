<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Piwi Picker</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --surface: #f9fafb;
        --fg: #111827;
        --muted: #6b7280;
        --border: #e5e7eb;
        --accent: #7c3aed;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111827;
          --surface: #1f2937;
          --fg: #f9fafb;
          --muted: #9ca3af;
          --border: #374151;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        /* 440 is the measured threshold at which every tile's hint still fits
           on one line now that the icon and shortcut key share the row with
           it; below this they wrap and give back the height the row layout
           just saved, above it nothing further is gained. */
        width: 440px;
        background: var(--bg);
        color: var(--fg);
        font:
          13px/1.5 ui-sans-serif,
          system-ui,
          -apple-system,
          sans-serif;
      }
      .popup {
        padding: 14px;
      }
      header {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
        font-weight: 600;
      }
      header img {
        border-radius: 5px;
      }
      header span {
        flex: 1;
      }
      .icon-button {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 26px;
        height: 26px;
        padding: 0;
        border-radius: 7px;
        border: 1px solid transparent;
        background: none;
        color: var(--muted);
        cursor: pointer;
        flex-shrink: 0;
      }
      .icon-button:hover,
      .icon-button:focus-visible {
        color: inherit;
        background: var(--surface);
        border-color: var(--border);
      }
      .icon-button svg {
        width: 16px;
        height: 16px;
        stroke: currentColor;
        stroke-width: 1.75;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .active-project-row {
        margin-bottom: 10px;
      }
      .active-project-row label {
        display: block;
        font-size: 10.5px;
        color: var(--muted);
        margin-bottom: 3px;
      }
      .active-project-row select {
        width: 100%;
        font: inherit;
        font-size: 12.5px;
        padding: 6px 8px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: inherit;
      }
      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      /* Row rather than column: the icon sits beside the text instead of
         above it, which drops a whole line off every tile and keeps the
         popup short enough not to scroll. */
      .actions button {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        padding: 9px 10px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      .actions button:hover,
      .actions button:focus-visible {
        border-color: var(--accent);
      }
      .actions button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      /* The tool currently running on the page. Only one can be, so this also
         answers "did that actually start?" at a glance. */
      .actions button.running {
        border-color: var(--accent);
        box-shadow: inset 0 0 0 1px var(--accent);
      }
      .actions button.running .label::after {
        content: ' ·  running';
        color: var(--accent);
        font-weight: 500;
        font-size: 10.5px;
      }
      .actions button.primary.running .label::after {
        color: #fff;
      }
      .actions .text {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 1px;
      }
      .actions button svg {
        width: 18px;
        height: 18px;
        flex-shrink: 0;
        stroke: currentColor;
        stroke-width: 1.75;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
        opacity: 0.9;
      }
      .actions .label {
        font-size: 12.5px;
        font-weight: 600;
        line-height: 1.3;
      }
      .actions .hint {
        color: var(--muted);
        font-size: 10.5px;
        line-height: 1.35;
      }
      .actions button.primary .hint {
        color: #ffffffcc;
      }
      .actions .key {
        flex-shrink: 0;
        font:
          10px ui-monospace,
          monospace;
        min-width: 16px;
        text-align: center;
        padding: 1px 3px;
        border-radius: 4px;
        border: 1px solid var(--border);
        color: var(--muted);
      }
      .actions button.primary .key {
        border-color: #ffffff55;
        color: #ffffffcc;
      }
      footer {
        margin-top: 12px;
        color: var(--muted);
        font-size: 11px;
      }
      footer a {
        color: inherit;
      }
      kbd {
        font:
          10.5px ui-monospace,
          monospace;
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 1px 4px;
      }
      #status {
        color: var(--muted);
        font-size: 11.5px;
        margin-bottom: 8px;
      }
      /* Only ever filled in on an error, so reserving a line for it left a
         permanent gap under the header. Collapse it until there's something
         to say — a message appearing pushes the actions down, which is the
         point of it. */
      #status:empty {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="popup">
      <header>
        <img src="icons/icon-32.png" width="18" height="18" alt="" />
        <span>Piwi Picker</span>
        <button id="config-button" type="button" class="icon-button" aria-label="Configure Piwi connection" title="Configure Piwi connection">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="3" />
            <path
              d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 005 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"
            />
          </svg>
        </button>
      </header>
      <div id="status"></div>
      <div id="active-project-row" class="active-project-row" style="display: none">
        <label for="active-project">Active project</label>
        <select id="active-project"></select>
      </div>
      <div class="actions">
        <button id="record" type="button" aria-keyshortcuts="1">
          <span class="text">
            <span class="label" id="record-label">Record actions</span>
            <span class="hint" id="record-hint">Multi-page → TypeScript</span>
          </span>
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="8" />
          </svg>
          <kbd class="key" aria-hidden="true">1</kbd>
        </button>
        <button id="pick" class="primary" type="button" aria-keyshortcuts="2">
          <span class="text">
            <span class="label">Pick an element</span>
            <span class="hint">Ranked, stable locators</span>
          </span>
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="6.5" />
            <path d="M12 2v3.5M12 18.5V22M2 12h3.5M18.5 12H22" />
          </svg>
          <kbd class="key" aria-hidden="true">2</kbd>
        </button>
        <button id="hover-inspect" type="button" aria-keyshortcuts="3">
          <span class="text">
            <span class="label">Hover-inspect</span>
            <span class="hint">Toggle: locator tooltip</span>
          </span>
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M2.5 12S6 6.5 12 6.5 21.5 12 21.5 12 18 17.5 12 17.5 2.5 12 2.5 12z" />
            <circle cx="12" cy="12" r="2.5" />
          </svg>
          <kbd class="key" aria-hidden="true">3</kbd>
        </button>
        <button id="locator-console" type="button" aria-keyshortcuts="4">
          <span class="text">
            <span class="label">Locator console</span>
            <span class="hint">See matches live</span>
          </span>
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <rect x="2.5" y="4" width="19" height="16" rx="2" />
            <path d="M6.5 9.5l3 2.5-3 2.5M13 15h4.5" />
          </svg>
          <kbd class="key" aria-hidden="true">4</kbd>
        </button>
        <button id="multi-pick" type="button" aria-keyshortcuts="5">
          <span class="text">
            <span class="label">Multi-pick</span>
            <span class="hint">2–3 items → a list</span>
          </span>
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <rect x="3" y="4" width="18" height="5" rx="1.5" />
            <rect x="3" y="12.5" width="18" height="5" rx="1.5" />
            <path d="M7 21h10" />
          </svg>
          <kbd class="key" aria-hidden="true">5</kbd>
        </button>
        <button id="lint-overlay" type="button" aria-keyshortcuts="6">
          <span class="text">
            <span class="label">Lint overlay</span>
            <span class="hint">Untestable elements</span>
          </span>
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M12 3.5l9 16.5H3z" />
            <path d="M12 10v4M12 17h.01" />
          </svg>
          <kbd class="key" aria-hidden="true">6</kbd>
        </button>
        <button id="assertion-panel" type="button" aria-keyshortcuts="7">
          <span class="text">
            <span class="label">Assertions</span>
            <span class="hint">Ranked expect(…) lines</span>
          </span>
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="8.5" />
            <path d="M8 12.2l2.8 2.8L16 9" />
          </svg>
          <kbd class="key" aria-hidden="true">7</kbd>
        </button>
        <button id="session-panel" type="button" aria-keyshortcuts="8">
          <span class="text">
            <span class="label">Session</span>
            <span class="hint">Name picks → export</span>
          </span>
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M6.5 3h11a1 1 0 011 1v16.5l-6.5-3.8-6.5 3.8V4a1 1 0 011-1z" />
          </svg>
          <kbd class="key" aria-hidden="true">8</kbd>
        </button>
        <button id="agent-context-panel" type="button" aria-keyshortcuts="9">
          <span class="text">
            <span class="label">Agent context</span>
            <span class="hint">Summary for an AI</span>
          </span>
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M11 3l1.9 5.1L18 10l-5.1 1.9L11 17l-1.9-5.1L4 10l5.1-1.9z" />
            <path d="M18 15l.8 2.2L21 18l-2.2.8L18 21l-.8-2.2L15 18l2.2-.8z" />
          </svg>
          <kbd class="key" aria-hidden="true">9</kbd>
        </button>
        <button id="test-function-panel" type="button" aria-keyshortcuts="0">
          <span class="text">
            <span class="label">Test functions</span>
            <span class="hint">Check the catalog here</span>
          </span>
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M9 11l2.5 2.5L15 9" />
            <rect x="2.5" y="3.5" width="19" height="17" rx="2.5" />
          </svg>
          <kbd class="key" aria-hidden="true">0</kbd>
        </button>
      </div>
      <footer>
        Press <kbd>1</kbd>–<kbd>0</kbd> to run an action ·
        <!-- Filled in from chrome.commands.getAll(): the browser may not have
             been able to assign the suggested key, and claiming one that isn't
             bound is worse than saying so. -->
        <span id="pick-shortcut"></span> ·
        <a href="https://piwitests.dev/extension" target="_blank" rel="noopener">docs</a>
      </footer>
    </div>
    <script type="module" src="src/popup/main.ts"></script>
  </body>
</html>
