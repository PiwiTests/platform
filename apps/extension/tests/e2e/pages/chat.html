<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Support chat</title>
    <style>
      body {
        margin: 0;
        padding: 10px;
        font-family: system-ui, sans-serif;
        font-size: 13px;
      }
      .row {
        display: flex;
        gap: 6px;
        margin-top: 8px;
      }
      input {
        flex: 1;
        padding: 6px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
      }
      button {
        padding: 6px 10px;
        border-radius: 6px;
        border: 1px solid #4f46e5;
        background: #4f46e5;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <strong>Chat with us</strong>
    <p style="margin: 6px 0 0">Usually answers in 5 minutes.</p>
    <div class="row">
      <input aria-label="Message" placeholder="Type a message" />
      <button type="button">Send</button>
    </div>
  </body>
</html>
